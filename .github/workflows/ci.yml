name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-validation:
    name: Rust validation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  windows-build:
    name: Windows cubic-app build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build -p cubic-app

  ios-validation:
    name: Unsigned iOS compile validation
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - name: Confirm iPhoneOS SDK availability
        run: xcrun --sdk iphoneos --show-sdk-path
      - name: Compile-check the workspace for ARM64 iOS
        run: cargo check --workspace --all-targets --target aarch64-apple-ios
      - name: Build the reusable iOS platform library
        run: cargo build -p cubic-platform --lib --target aarch64-apple-ios
